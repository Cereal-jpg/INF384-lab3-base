name: infra

# Pipeline de infraestructura. Es dueno de la existencia y la configuracion
# de la funcion, y no toca la imagen.

on:
  pull_request:
    paths:
      - 'infra/**'
  push:
    branches:
      - main
    paths:
      - 'infra/**'
  workflow_dispatch:
    inputs:
      autorizar_destruccion:
        description: 'Autorizar explicitamente destrucciones o reemplazos del plan'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:

  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Terraform 1.10
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Credenciales temporales
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Inicializar Terraform con el backend remoto
        working-directory: infra
        run: terraform init -backend-config=backend.hcl

      - name: Validar configuracion Terraform
        working-directory: infra
        run: terraform validate

  politicas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Analizar politicas IaC
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra/
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table

  plan:
    needs: [validar, politicas]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Terraform 1.10
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Credenciales temporales
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Inicializar Terraform con el backend remoto
        working-directory: infra
        run: terraform init -backend-config=backend.hcl

      - name: Generar plan
        working-directory: infra
        run: terraform plan -out=tfplan

      - name: Exportar plan JSON
        working-directory: infra
        run: terraform show -json tfplan > tfplan.json

      - name: Exportar plan legible
        working-directory: infra
        run: terraform show tfplan > tfplan.txt

      - name: Publicar plan en el pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN: ${{ github.workspace }}/infra/tfplan.txt
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan -->';
            const plan = fs.readFileSync(process.env.PLAN, 'utf8');
            const escaped = plan
              .replaceAll('&', '&amp;')
              .replaceAll('<', '&lt;')
              .replaceAll('>', '&gt;');
            const body = `${marker}
            ## Terraform plan

            <details>
            <summary>Ver plan completo</summary>

            <pre>${escaped}</pre>
            </details>`;
            const { owner, repo } = context.repo;
            const issue = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number: issue });
            const previous = comments.data.find((comment) => comment.body.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue, body });
            }

      - name: Bloquear destrucciones no autorizadas
        working-directory: infra
        env:
          AUTORIZAR_DESTRUCCION: ${{ inputs.autorizar_destruccion }}
        run: |
          destrucciones="$(jq -r '
            .resource_changes[]?
            | select(.change.actions | index("delete") != null)
            | .address
          ' tfplan.json)"

          if [ -n "$destrucciones" ] && [ "$AUTORIZAR_DESTRUCCION" != "true" ]; then
            echo "::error::El plan contiene destrucciones o reemplazos no autorizados."
            {
              echo '### Destrucciones no autorizadas — HALLAZGO'
              echo
              echo 'El plan contiene estas direcciones con la accion `delete`:'
              echo
              echo '```text'
              echo "$destrucciones"
              echo '```'
              echo
              echo 'Para una ejecucion manual excepcional, habilita `autorizar_destruccion` en workflow_dispatch.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo '### Destrucciones — OK'
            echo
            if [ -n "$destrucciones" ]; then
              echo 'Las destrucciones fueron autorizadas explicitamente mediante workflow_dispatch.'
            else
              echo 'El plan no contiene acciones `delete`.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar artefactos del plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            infra/tfplan
            infra/tfplan.json
            infra/tfplan.txt
          if-no-files-found: error

  aplicar:
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Terraform 1.10
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Credenciales temporales
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Descargar plan aprobado
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: infra/

      - name: Inicializar Terraform con el backend remoto
        working-directory: infra
        run: terraform init -backend-config=backend.hcl

      - name: Aplicar plan guardado
        working-directory: infra
        run: terraform apply -auto-approve tfplan
