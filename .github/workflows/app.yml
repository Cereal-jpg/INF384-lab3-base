name: app

# Pipeline de aplicacion. Es dueno de la imagen que ejecuta la funcion y no
# toca la infraestructura.
#
# De las cuatro gates, solo `secretos` detiene el pipeline. Las otras
# tres informan y dejan pasar: el hallazgo tiene que quedar visible en la
# ejecucion, no enterrado en el log.
#
# El repositorio no tiene archivo de excepciones. Un hallazgo que se decida
# no corregir se anota donde se produce: junto a la linea de codigo que lo
# origina, o en el paso del pipeline que lo detecta cuando el hallazgo no
# corresponde a ninguna linea. La anotacion lleva identificador del hallazgo,
# razon, responsable y fecha de vencimiento. Las cuatro, siempre.
#
# En los jobs sin implementar, preferir una action del marketplace o la
# imagen oficial de la herramienta antes que instalarla paso a paso en el
# runner. La guia del laboratorio lista las referencias disponibles.

on:
  push:
    paths:
      - 'src/**'
      - 'package*.json'
      - 'Dockerfile'
  pull_request:
    paths:
      - 'src/**'
      - 'package*.json'
      - 'Dockerfile'
  workflow_dispatch:

jobs:

  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar desde el lock file
        run: npm ci

      - name: Pruebas con reporte de cobertura
        run: npm run test:coverage

      - name: Subir el reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/
          if-no-files-found: error

  calidad:
    needs: pruebas
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar cobertura
        uses: actions/download-artifact@v4
        with:
          name: cobertura
          path: coverage/

      - name: Analizar en SonarCloud
        id: sonar
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORG }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true

      - name: Publicar resultado de calidad
        if: always()
        run: |
          {
            echo '### Calidad'
            echo
            echo 'Estado del job SonarCloud: ${{ steps.sonar.outcome }}.'
            echo "El resultado esta disponible en [SonarCloud](https://sonarcloud.io/project/overview?id=${{ vars.SONAR_PROJECT_KEY }})."
          } >> "$GITHUB_STEP_SUMMARY"

  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Buscar credenciales
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencias:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Escanear dependencias
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: package-lock.json
          scanners: vuln
          format: table
          output: trivy.txt
          exit-code: '0'

      - name: Publicar resultado de dependencias
        if: always()
        run: |
          {
            echo '### Dependencias'
            echo
            echo 'Resultado de Trivy sobre el arbol completo de package-lock.json:'
            echo
            echo '```text'
            if [ -f trivy.txt ]; then cat trivy.txt; else echo 'No se genero el reporte.'; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  estatico:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Analizar el codigo fuente
        run: |
          set +e
          docker run --rm \
            --volume "${PWD}:/src" \
            --workdir /src \
            --env SEMGREP_SEND_METRICS=off \
            semgrep/semgrep \
            semgrep scan \
            --config=p/default \
            --config=p/javascript \
            --json --quiet \
            --output=semgrep.json \
            src/
          resultado=$?
          {
            echo '### Analisis estatico'
            echo
            if [ "$resultado" -eq 0 ]; then
              echo 'Semgrep no encontro hallazgos.'
            else
              echo 'Semgrep encontro hallazgos o no pudo completar el analisis:'
            fi
            echo
            echo '```json'
            if [ -f semgrep.json ]; then cat semgrep.json; else echo '{}'; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publicar:
    needs: [calidad, secretos, dependencias, estatico]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.publicar.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Credenciales temporales
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Entrar al registro
        id: registro
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir y publicar la imagen
        id: publicar
        env:
          REGISTRO: ${{ steps.registro.outputs.registry }}
          APLICACION: inf384-lab3
        run: |
          set -euo pipefail
          imagen="${REGISTRO}/${APLICACION}"
          sha="${GITHUB_SHA:0:7}"

          docker build \
            --platform linux/amd64 \
            --label "org.opencontainers.image.title=${APLICACION}" \
            --tag "${imagen}:${sha}" \
            .
          docker push "${imagen}:${sha}"

          digest="$(docker image inspect --format='{{index .RepoDigests 0}}' "${imagen}:${sha}")"
          case "$digest" in
            "${imagen}@sha256:"*) ;;
            *)
              echo "::error::El digest publicado no tiene el formato esperado: ${digest}"
              exit 1
              ;;
          esac

          docker tag "${imagen}:${sha}" "${imagen}:prd"
          docker push "${imagen}:prd"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Publicados ${imagen}:${sha} y ${imagen}:prd"

  # Este job viene completo y no se modifica.
  # Las estrategias de despliegue y la verificacion posterior son contenido
  # de la sesion 6. La pregunta de reflexion 2 pide leerlo.
  desplegar:
    needs: publicar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Credenciales temporales
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Actualizar la funcion por digest
        run: |
          aws lambda update-function-code \
            --function-name inf384-lab3 \
            --image-uri ${{ needs.publicar.outputs.digest }}

      - name: Esperar a que la actualizacion termine
        run: aws lambda wait function-updated --function-name inf384-lab3
